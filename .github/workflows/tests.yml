name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    # pinned so Python 3.9 stays available; ubuntu-latest no longer ships it
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies (pinned by constraints.txt)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt -c constraints.txt
      - name: Dependency consistency (installed set is conflict-free; declarations match the imports)
        run: |
          python -m pip check
          python -m pytest -q tests/test_dependencies.py
      - name: Compile all Python files
        run: python -m compileall -q skills tests
      - name: Lint (ruff - style, bugbear and security rules)
        run: python -m ruff check .
      - name: Manifest validation (plugin.json and .codex-plugin/plugin.json)
        run: python -m pytest -q tests/test_manifests.py
      - name: Security checks (secrets, forbidden files, unsafe code patterns)
        run: python -m pytest -q tests/test_repo_hygiene.py
      - name: Documentation checks (links, commands, settings and exit codes match the code)
        run: python -m pytest -q tests/test_docs.py
      - name: Run the full test suite (integration tests stay skipped unless explicitly enabled)
        run: python -m pytest -q -rs

  # Manual helper (Actions tab -> tests -> Run workflow): prints the newest versions that satisfy the declared
  # requirements on each supported Python, so constraints.txt / requirements-ci.txt / requirements-audit.txt can be
  # refreshed deliberately. It installs WITHOUT constraints on purpose and changes nothing in the repository.
  resolve-pins:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Newest pip, then the development set without constraints
        run: |
          python -m pip install --upgrade pip
          python -m pip --version
          python -m pip install -r requirements-dev.txt
          echo "=== FREEZE-DEV python ${{ matrix.python-version }} ==="
          python -m pip freeze --all
          echo "=== END-FREEZE-DEV ==="
      - name: Newest pip-audit in its own environment
        run: |
          python -m venv "$RUNNER_TEMP/audit-tool"
          "$RUNNER_TEMP/audit-tool/bin/python" -m pip install --upgrade pip pip-audit
          echo "=== FREEZE-AUDIT python ${{ matrix.python-version }} ==="
          "$RUNNER_TEMP/audit-tool/bin/python" -m pip freeze --all
          echo "=== END-FREEZE-AUDIT ==="

  # Manual smoke test only (Actions tab -> tests -> Run workflow). Makes ONE normal caption
  # request for one public video, no cookies or credentials. Never runs on push or pull request.
  live-fetch:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Fetch one public transcript
        run: |
          python skills/youtube-conversation/scripts/transcript.py fetch "https://youtu.be/dQw4w9WgXcQ" --out "$RUNNER_TEMP/live.json"
          python skills/youtube-conversation/scripts/transcript.py show "$RUNNER_TEMP/live.json" --stats

  # Manual check only (never runs on push or pull request): requests the five public documentation pages and
  # requires HTTP 200 for each, then checks every same-site link found on those pages (relative links are
  # resolved against the page they appear on). Redirects are followed; any failure fails the job.
  pages-check:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PAGES_BASE: https://manas07-cyber.github.io/tubeGPT-/
      REPO_URL_PREFIX: https://github.com/Manas07-cyber/tubeGPT-
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check public pages and links
        run: |
          python - <<'PY'
          import os, sys, urllib.error, urllib.request
          from html.parser import HTMLParser
          from urllib.parse import urldefrag, urljoin

          BASE = os.environ["PAGES_BASE"]
          REPO = os.environ["REPO_URL_PREFIX"]
          PAGES = ["", "about.html", "privacy.html", "terms.html", "support.html"]
          TIMEOUT = 20

          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": "tubeGPT-pages-check"})
              try:
                  with urllib.request.urlopen(req, timeout=TIMEOUT) as r:  # follows redirects
                      return r.status, r.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                  return e.code, ""
              except Exception as e:  # DNS failure, timeout, TLS error ...
                  return "ERR " + type(e).__name__, ""

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.hrefs = []
              def handle_starttag(self, tag, attrs):
                  for k, v in attrs:
                      if k in ("href", "src") and v:
                          self.hrefs.append(v)

          failures = []
          to_check = {}
          for page in PAGES:
              url = BASE + page
              status, body = get(url)
              print(f"{status} {url}")
              if status != 200:
                  failures.append(f"page {url} returned {status}")
                  continue
              parser = Links()
              parser.feed(body)
              for href in parser.hrefs:
                  target, _ = urldefrag(urljoin(url, href.strip()))
                  if target.startswith(("mailto:", "tel:", "javascript:")) or not target:
                      continue
                  if target.startswith(BASE) or target.startswith(REPO):
                      to_check.setdefault(target, url)

          print(f"--- {len(to_check)} same-site / repository links")
          for target, source in sorted(to_check.items()):
              status, _ = get(target)
              print(f"{status} {target}  (found on {source})")
              if status != 200:
                  failures.append(f"link {target} (on {source}) returned {status}")

          if failures:
              print("\nFAILED:")
              for f in failures:
                  print(" - " + f)
              sys.exit(1)
          print("\nAll pages and links returned 200.")
          PY

  # Manual check only (never runs on push or pull request, so ordinary CI never depends on a vulnerability
  # database being reachable): asks the PyPI advisory data whether the declared runtime dependencies,
  # as a normal user would install them (newest compatible versions), have known vulnerabilities.
  dependency-audit:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit runtime dependencies
        run: |
          python -m pip install "pip-audit>=2.7,<3"
          python -m pip_audit -r requirements.txt --desc on
