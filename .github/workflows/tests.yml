name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    # pinned so Python 3.9 stays available; ubuntu-latest no longer ships it
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
      - name: Compile all Python files
        run: python -m compileall -q skills tests
      - name: Run tests
        run: python -m pytest -q

  # Manual smoke test only (Actions tab -> tests -> Run workflow). Makes ONE normal caption
  # request for one public video, no cookies or credentials. Never runs on push or pull request.
  live-fetch:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Fetch one public transcript
        run: |
          python skills/youtube-conversation/scripts/transcript.py fetch "https://youtu.be/dQw4w9WgXcQ" --out "$RUNNER_TEMP/live.json"
          python skills/youtube-conversation/scripts/transcript.py show "$RUNNER_TEMP/live.json" --stats

  # Manual check only (never runs on push or pull request): requests the five public documentation pages and
  # requires HTTP 200 for each, then checks every same-site link found on those pages (relative links are
  # resolved against the page they appear on). Redirects are followed; any failure fails the job.
  pages-check:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PAGES_BASE: https://manas07-cyber.github.io/tubeGPT-/
      REPO_URL_PREFIX: https://github.com/Manas07-cyber/tubeGPT-
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check public pages and links
        run: |
          python - <<'PY'
          import os, sys, urllib.error, urllib.request
          from html.parser import HTMLParser
          from urllib.parse import urldefrag, urljoin

          BASE = os.environ["PAGES_BASE"]
          REPO = os.environ["REPO_URL_PREFIX"]
          PAGES = ["", "about.html", "privacy.html", "terms.html", "support.html"]
          TIMEOUT = 20

          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": "tubeGPT-pages-check"})
              try:
                  with urllib.request.urlopen(req, timeout=TIMEOUT) as r:  # follows redirects
                      return r.status, r.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                  return e.code, ""
              except Exception as e:  # DNS failure, timeout, TLS error ...
                  return "ERR " + type(e).__name__, ""

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.hrefs = []
              def handle_starttag(self, tag, attrs):
                  for k, v in attrs:
                      if k in ("href", "src") and v:
                          self.hrefs.append(v)

          failures = []
          to_check = {}
          for page in PAGES:
              url = BASE + page
              status, body = get(url)
              print(f"{status} {url}")
              if status != 200:
                  failures.append(f"page {url} returned {status}")
                  continue
              parser = Links()
              parser.feed(body)
              for href in parser.hrefs:
                  target, _ = urldefrag(urljoin(url, href.strip()))
                  if target.startswith(("mailto:", "tel:", "javascript:")) or not target:
                      continue
                  if target.startswith(BASE) or target.startswith(REPO):
                      to_check.setdefault(target, url)

          print(f"--- {len(to_check)} same-site / repository links")
          for target, source in sorted(to_check.items()):
              status, _ = get(target)
              print(f"{status} {target}  (found on {source})")
              if status != 200:
                  failures.append(f"link {target} (on {source}) returned {status}")

          if failures:
              print("\nFAILED:")
              for f in failures:
                  print(" - " + f)
              sys.exit(1)
          print("\nAll pages and links returned 200.")
          PY
