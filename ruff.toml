# Lint configuration for tubeGPT. Run: python -m ruff check .
target-version = "py311"         # the oldest Python version the project supports and tests (see README)
line-length = 120
extend-exclude = ["assets"]

[lint]
# E/W: pycodestyle, F: pyflakes, B: bugbear (likely bugs), S: bandit-style security checks
select = ["E", "F", "W", "B", "S"]

[lint.per-file-ignores]
# Tests use bare asserts, fixed temporary paths and throwaway fixture values by design.
"tests/*" = ["S101", "S105", "S106", "S108", "S311", "E501"]   # E501: long caption/JSON sample strings
# The concurrency tests start the project's own script with sys.executable and fixed arguments (no shell, no input).
"tests/test_storage_security.py" = ["S603"]
# The Windows tests run icacls.exe and cmd.exe (full System32 paths, fixed arguments, no shell) to set an owner and make a junction.
"tests/test_windows_security.py" = ["S603"]
# Realistic YouTube rolling-caption samples contain whitespace-only lines on purpose (the parser handles them).
"tests/test_subtitles.py" = ["W293"]
